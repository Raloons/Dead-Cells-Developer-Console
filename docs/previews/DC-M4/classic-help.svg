<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#26343b"/><text x="24" y="32" fill="#9caab2" font-family="sans-serif" font-size="16">OFFLINE LAYOUT PREVIEW — synthetic state, not native gameplay</text><rect x="0" y="360" width="1600" height="540" fill="#0A0E14" opacity="0.88"/><rect x="0" y="868" width="1600" height="32" fill="#1A2631" opacity="0.96"/><rect x="0" y="868" width="1600" height="1" fill="#ABBBD0" opacity="0.65"/><text x="12" y="382" fill="#ABBBD0" font-family="Consolas,monospace" font-size="16">Developer Console  |  help · search · spawn</text><text x="12" y="889" fill="#ABBBD0" font-family="Consolas,monospace" font-size="16">&gt;</text><text x="12" y="414" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">&gt; help spawn</text><text x="12" y="438" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">spawn &lt;query&gt; [level=1-99] [quality=base|+|++|S|L]</text><text x="12" y="462" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">  Drop equipment at your feet, optionally forged to a level/quality.</text><text x="12" y="486" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">  safety: run-state</text><text x="12" y="510" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">  aliases: spawnitem</text><text x="12" y="534" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">  examples:</text><text x="12" y="558" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">    spawn assault shield</text><text x="12" y="582" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">    spawn StartSword level=4 quality=S</text><text x="12" y="606" fill="#e8e8e8" font-family="Consolas,monospace" font-size="16">    spawn multiple-nocks bow legendary</text><text x="36" y="889" fill="#FFFFFF" font-family="Consolas,monospace" font-size="16"></text></svg>